name: Linux build

# A focused, standalone workflow for building every Linux artifact:
#   1. linux-app     — the Electron desktop app (AppImage, deb, rpm, tar.xz)
#   2. linux-server  — the headless i686 browser-server portable zip
#
# It builds and smoke-tests both, then uploads the artifacts. It does NOT
# publish releases — the combined `desktop-release.yml` owns tagging/publishing.
# This workflow exists so Linux artifacts can be built and verified on demand,
# or on PRs that touch the desktop/server/client trees, without running the
# full multi-OS release matrix.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'desktop/**'
      - 'server/**'
      - 'client/**'
      - '.github/workflows/linux-build.yml'

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Electron desktop app for Linux (x64): AppImage, deb, rpm, tar.xz.
  # Mirrors the Linux leg of `desktop-release.yml`'s build matrix, isolated so
  # it can run on its own.
  # -------------------------------------------------------------------------
  linux-app:
    name: Linux desktop app (x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      # Exercise the retry contract before any dependency download.
      - name: Test download retry helper
        shell: bash
        run: node --test desktop/scripts/retry-network-step.checks.mjs

      # #948: electron-builder reads desktop/package.json for the artifact
      # filenames and the latest*.yml updater manifests. A stale version
      # silently mislabels the whole release and breaks auto-update. Fail the
      # tagged run before the install/build/package steps instead of publishing
      # mislabeled artifacts. Untagged runs have no tag to compare against.
      - name: Verify desktop version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./desktop/package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=desktop/package.json::desktop/package.json is $VERSION, but the tag is $GITHUB_REF_NAME. Set desktop/package.json and desktop/package-lock.json to ${GITHUB_REF_NAME#v}, then move the tag."
            exit 1
          fi
          echo "desktop/package.json $VERSION matches tag $GITHUB_REF_NAME."

      - name: Install workspace dependencies
        shell: bash
        run: bash desktop/scripts/retry-network-step.sh npm ci

      # The dashboard is built on the runner's native Node; its Vite/Tailwind
      # toolchain has no ia32 binaries, but the output is JS/CSS for any host.
      - name: Build client
        run: npm run build -w client

      # `npm ci` rather than `install`: install rewrites desktop/package-lock.json
      # in place, which would quietly repair a stale lockfile version before the
      # lockfile-sync assertion in src/__tests__/version.test.ts ever sees it.
      - name: Install desktop dependencies
        shell: bash
        run: bash desktop/scripts/retry-network-step.sh npm --prefix desktop ci

      - name: Run desktop tests
        run: npm --prefix desktop test

      - name: Build desktop bundles
        shell: bash
        run: |
          npm --prefix desktop run build:all
          # Stage client/dist into desktop/ so electron-builder's extraResources
          # source stays inside desktop/ (no `../`), which keeps the repo root
          # from being treated as the copy base.
          npm --prefix desktop run stage:client

      # Run electron-builder with desktop/ as its own project root. Invoked from
      # the monorepo root it walks up, treats the repo root as the project, and
      # pulls parent files into the asar — failing with "<file> must be under
      # …/desktop/". Running from desktop/ and hiding the root package.json (whose
      # `workspaces` field triggers the upward scan) makes desktop/ the root.
      # --publish never: the publish provider exists so latest*.yml update
      # metadata gets GENERATED, not so electron-builder uploads.
      - name: Package Linux installers
        shell: bash
        run: |
          set -euo pipefail
          mv package.json "$RUNNER_TEMP/root-package.json"
          cd desktop
          bash scripts/retry-network-step.sh npx --no-install electron-builder --linux --x64 --publish never

      # Confirm every configured Linux target was produced before uploading.
      - name: Verify Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimage=(desktop/dist-electron/*.AppImage)
          tarxz=(desktop/dist-electron/*.tar.xz)
          deb=(desktop/dist-electron/*.deb)
          rpm=(desktop/dist-electron/*.rpm)
          feed=(desktop/dist-electron/latest-linux.yml)
          for group in "AppImage:${appimage[@]}" "tar.xz:${tarxz[@]}" "deb:${deb[@]}" "rpm:${rpm[@]}" "feed:${feed[@]}"; do
            name=${group%%:*}; files=${group#*:}
            if [ -z "$files" ]; then
              echo "::error::electron-builder produced no Linux $name artifact"
              exit 1
            fi
            echo "Linux $name: $files"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-desktop-x64
          path: |
            desktop/dist-electron/*.AppImage
            desktop/dist-electron/*.tar.xz
            desktop/dist-electron/*.deb
            desktop/dist-electron/*.rpm
            desktop/dist-electron/latest-linux.yml
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Headless i686 browser-server portable zip. No native addons, runs on distro
  # Node 18+ via the bundled WASM SQLite (node-sqlite3-wasm). Smoke-tested in a
  # 32-bit Alpine container so it is exercised on real ia32, not an x64 sim.
  # -------------------------------------------------------------------------
  linux-server:
    name: Linux i686 server (portable zip)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # The portable zip ships no native addons and bundles WASM SQLite, so the
      # server install skips lifecycle scripts (no node-gyp / sharp build needed
      # on the build host).
      - name: Package server and static dashboard on x64
        run: |
          npm ci --ignore-scripts
          npm --prefix desktop ci --ignore-scripts
          npm run build -w client
          npm --prefix desktop run dist:linux:x86-server

      # Run the extracted archive with 32-bit distro Node, without npm or
      # Electron, on a real ia32 container with no network.
      - name: Smoke-test the packaged archive on 32-bit Node
        run: |
          docker build --platform linux/386 -t ossllmapi-i686-test - <<'EOF'
          FROM alpine:3.22
          RUN apk add --no-cache nodejs ca-certificates
          EOF
          docker run --rm --platform linux/386 --network none --user 65534:65534 \
            -v "$PWD/desktop/dist-electron/browser:/downloads:ro" \
            -v "$PWD/desktop/scripts/smoke-linux-browser.mjs:/smoke.mjs:ro" \
            ossllmapi-i686-test sh -ec 'cd /tmp; tar -xzf /downloads/*.tar.gz; node /smoke.mjs /tmp/OSSLLMAPI-* ia32'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-i686-server
          path: desktop/dist-electron/browser/*.tar.gz
          if-no-files-found: error
