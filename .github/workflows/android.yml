name: Android standalone preview
on:
  workflow_dispatch:
  push:
    tags: ['android-v*'] # Not the stable desktop v* feed.
  pull_request:
    paths:
      - 'android/**'
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  package:
    name: Build, sign and verify every ABI
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Build production dashboard and gateway
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then test "$GITHUB_REF_NAME" = "android-v$(android/scripts/package.sh --version)"; fi
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build -w client -- --mode android --outDir ../android/build/dashboard --emptyOutDir
          node android/scripts/bundle.mjs
          python3 android/scripts/check-strings.py
          python3 android/tests/host.py
      - name: Prepare the signing identity
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DURABLE_ID: ${{ vars.ANDROID_PACKAGE_ID }}
        run: |
          # With no durable secret the build is a version-locked preview signed by
          # a one-time key; with one it keeps a stable ID so updates install in place.
          if [[ -n "${ANDROID_KEYSTORE_B64:-}" ]]; then
            source android/scripts/durable-key.sh
            echo "ANDROID_SIGNING_MODE=durable" >> "$GITHUB_ENV"
            echo "ANDROID_PACKAGE_ID=${DURABLE_ID:-io.github.zelvior.llmharbor.android}" >> "$GITHUB_ENV"
          else
            source android/scripts/preview-key.sh
            echo "ANDROID_SIGNING_MODE=preview" >> "$GITHUB_ENV"
          fi
          echo "::add-mask::$APK_PASSWORD"
          {
            echo "APK_KEYSTORE=$APK_KEYSTORE"
            echo "APK_ALIAS=$APK_ALIAS"
            echo "APK_PASSWORD=$APK_PASSWORD"
            echo "ANDROID_KEY_DIR=$APK_KEY_DIR"
          } >> "$GITHUB_ENV"
      - name: Package, sign and verify every ABI
        run: |
          trap 'rm -rf "$ANDROID_KEY_DIR"' EXIT
          android/scripts/package.sh
          cp android/build/package/package-id android/build/apks/package-id
          (cd android/build/apks && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Upload the signed APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks
          path: android/build/apks
          if-no-files-found: error
          compression-level: 0
  device-armv7:
    name: Install and exercise ARMv7 APK (Android 11)
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apks
          path: downloads
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install through Android 11's native bridge
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86
          emulator-build: 16428233
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ABI=armeabi-v7a EXPECTED_SDK=30 APK_DIR=downloads python3 android/tests/device.py
  device-api28:
    name: Install and exercise APK (Android 9, oldest supported)
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apks
          path: downloads
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Exercise the minSdk floor
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 28
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ABI=x86_64 EXPECTED_SDK=28 APK_DIR=downloads python3 android/tests/device.py
  device-x86_64:
    name: Install and exercise x86_64 APK (Android 14)
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apks
          path: downloads
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install the native 64-bit build
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-build: 16428233
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ABI=x86_64 EXPECTED_SDK=34 APK_DIR=downloads python3 android/tests/device.py
  release:
    name: Publish the tested APKs (never latest)
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: [package, device-armv7, device-api28, device-x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apks
          path: downloads
      - name: Release only the APKs that passed their device tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(android/scripts/package.sh --version)
          test "$GITHUB_REF_NAME" = "android-v$version"
          sed '/^## Build it yourself/,$d' android/README.md > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<'NOTES'

          **Assets:** one APK per CPU. Phones need `arm64-v8a` (most devices since ~2016) or
          `armeabi-v7a` (older and low-RAM phones, Android 11 Go). `x86_64` is for emulators and Chromebooks.
          Android will not install an APK whose CPU does not match the device, so pick the first line that works.

          `SHA256SUMS.txt` covers every APK in this release.
          NOTES
          cd downloads
          rm -f package-id
          sha256sum --check SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./*.apk SHA256SUMS.txt --verify-tag --prerelease --latest=false \
            --title "LLMHarbor for Android 8.0+ ($version)" --notes-file "$RUNNER_TEMP/notes.md"
