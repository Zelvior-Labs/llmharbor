# Pass --win nsis zip --ia32 explicitly: electron-builder merges target lists
# from parent configs, which would otherwise also select the base x64 targets.
extends: ./electron-builder.yml
directories:
  output: dist-electron/ia32
win:
  artifactName: "${productName}-${version}-windows-x86.${ext}"
nsis:
  artifactName: "${productName}-${version}-windows-x86-setup.${ext}"
# Windows updaters normally all read latest.yml (the existing x64 feed).
# This sets both the published manifest name and the channel in app-update.yml.
publish:
  channel: latest-ia32
