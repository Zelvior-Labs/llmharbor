name: Android ARMv7 standalone preview
on:
  workflow_dispatch:
  push:
    tags: ['android-v*'] # Not the stable desktop v* feed.
  pull_request:
    paths:
      - 'android/**'
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  phone:
    name: Install and exercise release APK (Android 11, ARMv7)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Build production dashboard and gateway
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then test "$GITHUB_REF_NAME" = "android-v$(android/scripts/package.sh --version)"; fi
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build -w client -- --mode android --outDir ../android/build/dashboard --emptyOutDir
          node android/scripts/bundle.mjs
          python3 android/tests/host.py
      - name: Package and sign the isolated ARMv7 preview
        run: |
          source android/scripts/preview-key.sh
          trap 'rm -f "$APK_KEYSTORE"' EXIT
          android/scripts/package.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install APK; launch the ARM library through Android 11's native bridge
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86
          emulator-build: 16428233
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 android/tests/device.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-armeabi-v7a
          path: android/build/apks/*.apk
          if-no-files-found: error
          compression-level: 0
  release:
    name: Publish the tested APK (never latest)
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: phone
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-armeabi-v7a
          path: downloads
      - name: Release only a new version-locked preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(android/scripts/package.sh --version)
          test "$GITHUB_REF_NAME" = "android-v$version"
          sed '/^## Build it yourself/,$d' android/README.md > "$RUNNER_TEMP/notes.md"
          cd downloads
          apk="OSSLLMAPI-$version-android-armeabi-v7a.apk"
          sha256sum "$apk" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "$apk" SHA256SUMS.txt --verify-tag --prerelease --latest=false \
            --title "OSSLLMAPI for Android 11 · ARMv7 ($version)" --notes-file "$RUNNER_TEMP/notes.md"
