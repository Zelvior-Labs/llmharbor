name: Release

# ONE workflow builds, tests, renames and publishes every LLMHarbor download:
#
#   Windows 10/11   x64 + x86 NSIS installers (auto-update feeds) and portable ZIPs
#   Windows 7/8/8.1 x64 + x86 per-user installers and portable ZIPs (Electron-Legacy)
#   macOS           Apple silicon + Intel DMG/ZIP (signed when the Apple secrets exist)
#   Linux           x64 + arm64 desktop AppImage, .deb, .rpm, .tar.xz
#   Linux Legacy    x86 + x64 .deb, AppImage and portable tar.gz (system Node.js 18+)
#   Android         armeabi-v7a, arm64-v8a and x86_64 APKs
#
# Run it from Actions → Release → "Run workflow" and fill in the tag (v + the
# desktop/package.json version), title, release type and notes. Nothing is
# uploaded until every build and smoke test has passed; a partial set never
# becomes visible. Pull requests that touch the packaged code run every build
# and test without publishing.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag. Must be v + desktop/package.json version, e.g. v1.0.0
        required: true
        type: string
      title:
        description: Release title (leave empty for "LLMHarbor <tag>")
        required: false
        type: string
        default: ''
      release_type:
        description: latest = stable and marked Latest (auto-update feeds), prerelease = not Latest, draft = hidden until published by hand
        required: true
        type: choice
        options: [latest, prerelease, draft]
        default: latest
      notes:
        description: auto = download guide + GitHub's generated changelog, table = download guide only
        required: true
        type: choice
        options: [auto, table]
        default: auto
      publish:
        description: Publish to GitHub Releases (uncheck to only build and test everything)
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - 'android/**'
      - 'client/**'
      - 'desktop/**'
      - 'server/**'
      - 'shared/**'
      - 'package-lock.json'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'true' || 'false' }}

jobs:
  prepare:
    name: Check the tag, version and release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # #948: v0.8.2–v0.8.4 shipped installers stamped 0.8.1 because
      # desktop/package.json was never bumped after v0.8.1. electron-builder
      # reads that field for the artifact filenames AND the latest*.yml updater
      # manifests, and the Android and Windows legacy packages derive their
      # versions from it, so a stale number silently mislabels the whole
      # release and breaks auto-update. Fail here, before any build starts.
      - name: Verify the tag matches desktop/package.json
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./desktop/package.json').version")
          tag=${INPUT_TAG:-v$version}
          tag=${tag// /}
          if [ "$tag" != "v$version" ]; then
            echo "::error file=desktop/package.json::desktop/package.json is $version, so every file would be stamped v$version, but the tag is $tag. Set desktop/package.json and desktop/package-lock.json to ${tag#v} first."
            exit 1
          fi
          if [ "$PUBLISH" = true ]; then
            sha=$(git rev-parse HEAD)
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$sha" \
                || { echo "::error::$tag already points to another commit than $sha"; exit 1; }
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft >/dev/null 2>&1; then
              test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true \
                || { echo "::error::$tag is already published; refusing to replace a published release"; exit 1; }
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Release $tag (publish: $PUBLISH)" >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop · ${{ matrix.label || matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to windows-2022 (VS 2022): node-gyp can't yet parse the VS "18"
          # toolset on windows-latest, which breaks the better-sqlite3 native build.
          - os: windows-2022
            ebArgs: --win --x64
            artifact: windows-installer
            glob: |
              desktop/dist-electron/*.exe
              desktop/dist-electron/*.zip
              desktop/dist-electron/*.blockmap
              desktop/dist-electron/latest.yml
          - os: windows-2022
            label: windows-2022, x86
            arch: ia32
            ebArgs: --win nsis zip --ia32 --config electron-builder.ia32.yml
            artifact: windows-installer-ia32
            glob: |
              desktop/dist-electron/ia32/*-windows-x86-setup.exe
              desktop/dist-electron/ia32/*-windows-x86.zip
              desktop/dist-electron/ia32/*-windows-x86-setup.exe.blockmap
              desktop/dist-electron/ia32/latest-ia32.yml
          - os: macos-latest
            arch: arm64
            ebArgs: --mac --arm64
            artifact: macos-installer-arm64
            glob: |
              desktop/dist-electron/*.dmg
              desktop/dist-electron/*.zip
              desktop/dist-electron/*.blockmap
              desktop/dist-electron/latest-mac.yml
          # Build and exercise better-sqlite3 natively on Intel (#1232).
          - os: macos-15-intel
            arch: x64
            ebArgs: --mac --x64
            artifact: macos-installer-x64
            glob: |
              desktop/dist-electron/*.dmg
              desktop/dist-electron/*.zip
              desktop/dist-electron/*.blockmap
              desktop/dist-electron/latest-mac.yml
          # electron-builder 25's FPM/RPM tooling is incompatible with the
          # Ubuntu 26.04 runner. Keep all Linux package formats on the tested LTS.
          - os: ubuntu-24.04
            ebArgs: --linux --x64
            artifact: linux-installer
            glob: |
              desktop/dist-electron/*.AppImage
              desktop/dist-electron/*.tar.xz
              desktop/dist-electron/*.deb
              desktop/dist-electron/*.rpm
              desktop/dist-electron/latest-linux.yml
          # Native arm64 runner (free for public repositories); the arm64
          # config only renames the files and the feed (latest-linux-arm64.yml).
          - os: ubuntu-24.04-arm
            label: ubuntu-24.04-arm, arm64
            arch: arm64
            ebArgs: --linux AppImage tar.xz deb rpm --arm64 --config electron-builder.arm64.yml
            artifact: linux-installer-arm64
            glob: |
              desktop/dist-electron/arm64/*.AppImage
              desktop/dist-electron/arm64/*.tar.xz
              desktop/dist-electron/arm64/*.deb
              desktop/dist-electron/arm64/*.rpm
              desktop/dist-electron/arm64/latest-linux-arm64.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      # Exercise the retry contract on every OS before any dependency download.
      - name: Test download retry helper
        shell: bash
        run: |
          # Use the runner's selected Git Bash, not an unrelated WSL bash.exe.
          if [ "$RUNNER_OS" = Windows ]; then
            export CI_RETRY_BASH_EXE="$(cygpath -w "$BASH")"
          fi
          node --test desktop/scripts/retry-network-step.checks.mjs

      # better-sqlite3 is rebuilt for Electron with node-gyp, which still
      # imports Python's distutils (removed in 3.12). Some macos-15-intel images
      # default to a Python without it, so the rebuild failed there
      # intermittently ("No module named 'distutils'"). Pin a Python that has
      # it on the macOS hosts instead of taking whatever the image ships.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'macOS'
        with:
          python-version: '3.11'

      - name: Install workspace dependencies
        shell: bash
        run: bash desktop/scripts/retry-network-step.sh npm ci

      # Build the dashboard on the runner's native Node: its Vite/Tailwind
      # toolchain has no Windows ia32 binaries. The resulting assets are JS/CSS.
      - name: Build client
        run: npm run build -w client

      # Install desktop dependencies under the target runtime so npm selects
      # the x86 sharp binary and electron-builder rebuilds SQLite for x86.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.arch == 'ia32'
        with:
          node-version: '20'
          architecture: x86

      # `npm ci` rather than `install`: install rewrites desktop/package-lock.json
      # in place, which would quietly repair a stale lockfile version before the
      # lockfile-sync assertion in src/__tests__/version.test.ts ever sees it.
      # ci installs the lockfile as committed, so that test is a real guard here.
      - name: Install desktop dependencies
        shell: bash
        run: bash desktop/scripts/retry-network-step.sh npm --prefix desktop ci

      # The per-platform window chrome (#703's menu-bar fix) lives in a branch
      # that never executes on a developer's mac. These run on both matrix
      # hosts, so the Windows expectations are asserted on Windows.
      - name: Run desktop tests
        run: npm --prefix desktop test

      - name: Build desktop bundles
        shell: bash
        run: |
          npm --prefix desktop run build:all
          # Stage client/dist into desktop/ so electron-builder's extraResources
          # source stays inside desktop/ (no `../`). Belt-and-suspenders with the
          # root-hiding below; also makes local `desktop:dist:win` work on Windows.
          npm --prefix desktop run stage:client

      - name: Test all 21 desktop agent setup flows
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: npm --prefix desktop run test:agent-setup

      - name: Validate macOS signing credentials
        id: maccreds
        if: runner.os == 'macOS' && env.PUBLISH == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}
        run: |
          set -euo pipefail
          # No signing cert at all → fall back to an unsigned DMG rather than
          # failing the release (users bypass Gatekeeper via right-click → Open
          # or xattr -d com.apple.quarantine). Signing cert present but broken
          # notarization config is still a hard error — that's a misconfiguration.
          if [ -z "${CSC_LINK:-}" ]; then
            echo "::warning::No MACOS_CSC_LINK secret — building an UNSIGNED DMG. Configure Apple Developer ID signing + notarization secrets for a Gatekeeper-clean release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          has_api_key_creds=false
          if [ -n "${APPLE_API_KEY_P8:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
            has_api_key_creds=true
          fi

          has_keychain_creds=false
          if [ -n "${APPLE_KEYCHAIN_PROFILE:-}" ]; then
            has_keychain_creds=true
          fi

          if [ "$has_api_key_creds" != true ] && [ "$has_keychain_creds" != true ]; then
            echo "Missing Apple notarization secrets. Provide APPLE_API_KEY_P8/APPLE_API_KEY_ID/APPLE_API_ISSUER (an App Store Connect API key), or APPLE_KEYCHAIN_PROFILE."
            exit 1
          fi
          if [ "$has_api_key_creds" = true ] && [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "APPLE_TEAM_ID is required alongside the API key so codesign picks the right Developer ID identity."
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "apikey=$has_api_key_creds" >> "$GITHUB_OUTPUT"

      # notarytool takes the App Store Connect key as a FILE (`--key <path>`), but
      # a GitHub secret is a string, so the .p8 has to be materialised on disk
      # first. $RUNNER_TEMP is job-scoped and wiped when the job ends, and the
      # runner is ephemeral, so the key never outlives this build. Writing it
      # before the package step (rather than inlining a path into that step's
      # `env:`) keeps the "which credential wins" logic in one place.
      - name: Write the App Store Connect API key
        if: steps.maccreds.outputs.signed == 'true' && steps.maccreds.outputs.apikey == 'true'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          # electron-builder reads APPLE_API_KEY as the path to hand notarytool.
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      # electron-builder makes its own temp keychain when handed CSC_LINK, and on
      # the macos-26 runner image that broke: its `security set-key-partition-list`
      # now fails with "SecKeychainUnlock: The user name or passphrase you entered
      # is not correct" and the build dies before signing anything. v0.9.5 built
      # fine on image 20260728.0273.1 and v0.9.6 failed on 20260831.0337.3, same
      # workflow and same secrets. Importing the certificate ourselves keeps every
      # keychain command under our control; electron-builder then only needs
      # CSC_KEYCHAIN (which it uses precisely when CSC_LINK is absent) and finds
      # the identity through the search list.
      - name: Import the Developer ID certificate
        if: steps.maccreds.outputs.signed == 'true'
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cert="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MACOS_CSC_LINK" | base64 --decode > "$cert"

          security create-keychain -p "$keychain_password" "$keychain"
          # Unlocked for the whole build; the runner is ephemeral and wiped after.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # -A lets any tool use the key, so codesign still works even when the
          # partition list below is refused — which is the failure being worked
          # around here, so it is a warning rather than a hard stop.
          security import "$cert" -k "$keychain" -P "$MACOS_CSC_KEY_PASSWORD" -A \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" >/dev/null 2>&1 \
            || echo "::warning::set-key-partition-list was refused; relying on the -A import"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain"

          # Fail here, with the keychain in front of us, rather than ten minutes
          # later inside electron-builder. Naming the identity explicitly also
          # spares it an autodiscovery pass over the search list.
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "No 'Developer ID Application' identity in the imported certificate."
            security find-identity -v -p codesigning "$keychain" || true
            exit 1
          fi
          echo "Signing identity: $identity"
          # electron-builder rejects a CSC_NAME carrying the certificate-type
          # prefix ("Please remove prefix \"Developer ID Application:\" from the
          # specified name"); it wants the common name alone and re-attaches the
          # prefix itself when matching identities.
          {
            echo "CSC_KEYCHAIN=$keychain"
            echo "CSC_NAME=${identity#Developer ID Application: }"
          } >> "$GITHUB_ENV"

      # GitHub reproduced the Intel runner's CloudKit failures as dropped
      # HTTP/3 (UDP 443) connections, not rejected notarizations. Force HTTPS
      # over TCP on this ephemeral signed-build runner before afterSign AND
      # the DMG step use stapler. Keep all ticket/Gatekeeper checks intact.
      # Remove when https://github.com/actions/runner-images/issues/14924 is fixed.
      - name: Use TCP for Apple notarization on Intel macOS
        if: matrix.os == 'macos-15-intel' && steps.maccreds.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'block return out quick proto udp from any to any port 443' | sudo pfctl -f -
          sudo pfctl -E

      # electron-builder's bundled fpm (deb/rpm) is x86_64-only. On the arm64
      # runner use a system fpm and rpmbuild instead.
      - name: Install system fpm for Linux arm64 packages
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby ruby-dev build-essential rpm libarchive-tools
          sudo gem install fpm --no-document
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      - name: Package installer
        shell: bash
        env:
          # Pull-request and artifact-only builds stay unsigned. Published macOS
          # release builds sign + notarize when the Apple secrets are configured
          # (so the downloaded DMG opens without Gatekeeper's "damaged" quarantine
          # block) and fall back to an unsigned DMG when they aren't.
          #
          # Notarization goes through the App Store Connect API key, not an
          # app-specific password. electron-builder checks APPLE_ID FIRST and
          # returns as soon as it is set, so leaving that pair configured would
          # silently shadow the API key — the two cannot coexist. The API key
          # also does not expire the way an app-specific password does.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && env.PUBLISH == 'true' && steps.maccreds.outputs.signed == 'true' && 'true' || 'false' }}
          # No CSC_LINK / CSC_KEY_PASSWORD: the step above imported the
          # certificate into a keychain of our own and exported CSC_KEYCHAIN +
          # CSC_NAME through $GITHUB_ENV. Setting CSC_LINK here would send
          # electron-builder back down its own temp-keychain path.
          # APPLE_API_KEY is deliberately absent here: the step above exports the
          # on-disk key path through $GITHUB_ENV, and a step-level `env:` entry
          # would override it with the raw PEM text.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEYCHAIN: ${{ secrets.APPLE_KEYCHAIN }}
          APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}
        run: |
          set -e
          # Unconfigured secrets arrive as EMPTY env vars, and electron-builder
          # treats a present-but-empty CSC_LINK as a certificate path — failing
          # with "<dir> not a file" on any non-PR build (PR builds never hit it
          # because electron-builder skips signing for pull requests). Drop empty
          # signing vars so unsigned builds actually build unsigned.
          for v in CSC_KEYCHAIN CSC_NAME APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID APPLE_KEYCHAIN APPLE_KEYCHAIN_PROFILE; do
            if [ -z "${!v:-}" ]; then unset "$v"; fi
          done
          # Run electron-builder with desktop/ as its own project root. Invoked
          # from the monorepo root (e.g. via `npm --prefix desktop run`), it walks
          # up, treats the repo root as the project, and on Windows pulls parent
          # files (.dockerignore, .env.example, …) into the asar — failing with
          # "<file> must be under …/desktop/". Running from desktop/ and hiding the
          # root package.json (whose `workspaces` field triggers the upward scan)
          # makes desktop/ the detected project root.
          mv package.json "$RUNNER_TEMP/root-package.json"
          cd desktop
          # --publish never: the publish provider in electron-builder.yml exists
          # so latest*.yml update metadata gets GENERATED, not so electron-builder
          # uploads. The final publish job owns publishing.
          # Preserve successful downloads/unpacked builds between transient
          # GitHub HTTP 5xx failures. Real packaging failures still fail fast.
          bash scripts/retry-network-step.sh npx --no-install electron-builder ${{ matrix.ebArgs }} --publish never

      # #1759: the installed app died at launch on Windows 11 with "GPU process
      # isn't usable. Goodbye." when the folder ACL lacked S-1-15-2-2. Launch a
      # copy with that broken ACL and the silently installed app, and require
      # both to come up and serve.
      - name: Smoke-test Windows GPU sandbox recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/scripts/smoke-win-gpu-sandbox.ps1 desktop/dist-electron ${{ matrix.arch }}

      - name: Verify Windows x86 ZIP and update feed
        if: matrix.arch == 'ia32'
        shell: pwsh
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          $dist = 'desktop/dist-electron/ia32'
          $app = Join-Path $env:RUNNER_TEMP 'x86-zip'
          Expand-Archive -Path "$dist/*-windows-x86.zip" -DestinationPath $app
          & (Join-Path $app 'LLMHarbor.exe') desktop/scripts/smoke-win-ia32.mjs $dist | Out-Host
          exit $LASTEXITCODE

      - name: Smoke-test packaged macOS backend
        if: runner.os == 'macOS'
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app_dir=desktop/dist-electron/mac
          if [ "$EXPECTED_ARCH" = arm64 ]; then app_dir="$app_dir-arm64"; fi
          app="$app_dir/LLMHarbor.app"
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/LLMHarbor" \
            desktop/scripts/smoke-mac-package.mjs "$app" "$EXPECTED_ARCH"

      # electron-builder notarizes and staples the .app, then wraps it in a DMG
      # it never submits. The DMG is the file users download, so it is the file
      # macOS quarantines and assesses — until it carries its own stapled
      # ticket, `spctl -t install` on the download reports "no usable
      # signature", which is #373's "damaged" block. The .app is signed inside
      # the build (dmg.sign in electron-builder.yml makes the DMG eligible to
      # submit); this finishes the job for the container.
      - name: Notarize and staple the DMG
        if: steps.maccreds.outputs.signed == 'true' && steps.maccreds.outputs.apikey == 'true'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(desktop/dist-electron/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::signing was enabled but electron-builder produced no DMG"
            exit 1
          fi
          # app-builder ships the blockmap generator electron-builder itself uses.
          app_builder=$(cd desktop && node -p "require('app-builder-bin').appBuilderPath")
          for dmg in "${dmgs[@]}"; do
            echo "== notarizing $(basename "$dmg") =="
            # --wait turns a rejection into a non-zero exit, so a failed
            # notarization fails the release instead of publishing a blocked DMG.
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait --timeout 30m
            # Stapling fetches the ticket from Apple's CloudKit, and the Intel
            # runners regularly lose that connection mid-request (error 68,
            # "The network connection was lost") right after Apple accepted
            # the submission. The ticket is already issued at that point, so
            # retrying with a short backoff is safe and is all it takes.
            for attempt in 1 2 3 4 5; do
              if xcrun stapler staple "$dmg" && xcrun stapler validate "$dmg"; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::stapling $(basename "$dmg") failed after $attempt attempts"
                exit 1
              fi
              echo "::warning::stapling attempt $attempt failed, retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            done
            # The verdict Gatekeeper will give the download.
            spctl -a -vv -t install "$dmg"
            # Stapling rewrites the DMG in place, so the size, hash and blockmap
            # electron-builder computed a moment ago no longer describe it.
            # electron-updater verifies that hash, so leaving it stale would
            # break updates for every installed copy.
            node desktop/scripts/refresh-mac-update-metadata.mjs \
              "$dmg" desktop/dist-electron/latest-mac.yml
            "$app_builder" blockmap --input "$dmg" --output "$dmg.blockmap" --compression gzip
          done

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
  # Electron has no 32-bit Linux build, so "Linux Legacy" is the API server and
  # browser dashboard run by the system's Node.js 18+ (pure-WASM SQLite, no
  # native addons), packaged for x86 and x64 as .deb, AppImage and tar.gz.
  linux-legacy:
    name: Linux Legacy · package x86 and x64
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build the server bundle and static dashboard on x64
        run: |
          bash desktop/scripts/retry-network-step.sh npm ci --ignore-scripts
          bash desktop/scripts/retry-network-step.sh npm --prefix desktop ci --ignore-scripts
          npm run build -w client
          npm --prefix desktop run dist:linux:legacy
      - name: Fetch checksum-pinned AppImage tooling
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/appimage"
          mkdir -p "$tools"
          fetch() {
            curl -fsSL --retry 3 --retry-all-errors --max-time 240 -o "$tools/$2" "$1"
            echo "$3  $tools/$2" | sha256sum --check
          }
          fetch https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            appimagetool ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          fetch https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-i686 \
            runtime-i686 e72ea0b140a0a16e680713238a6f30aad278b62c4ca17919c554864124515498
          fetch https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 \
            runtime-x86_64 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          chmod +x "$tools/appimagetool"
          echo "APPIMAGETOOL=$tools/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME_DIR=$tools" >> "$GITHUB_ENV"
      - name: Package portable, .deb and AppImage for x86 and x64
        run: desktop/linux-browser/package-legacy.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-legacy
          path: desktop/dist-electron/linux-legacy/*
          if-no-files-found: error
          compression-level: 0

  # Every file is started and exercised (SQLite, dashboard, login, /v1/models)
  # on old and current Node lines; x86 runs a real 32-bit userland, offline.
  linux-legacy-test:
    name: Linux Legacy · ${{ matrix.label }}
    needs: linux-legacy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 'x64 · Node 18', arch: x64, node: '18' }
          - { label: 'x64 · Node 20', arch: x64, node: '20' }
          - { label: 'x64 · Node 22', arch: x64, node: '22' }
          - { label: 'x86 · Alpine 3.18 · Node 18', arch: x86, image: 'alpine:3.18' }
          - { label: 'x86 · Alpine 3.22 · Node 22', arch: x86, image: 'alpine:3.22' }
          - { label: 'x86 · Debian 12 · Node 18', arch: x86, image: 'debian:12' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-legacy
          path: downloads
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.arch == 'x64'
        with:
          node-version: ${{ matrix.node }}
      - name: Run the x64 portable, AppImage and installed .deb
        if: matrix.arch == 'x64'
        run: |
          set -euo pipefail
          smoke="$PWD/desktop/scripts/smoke-linux-browser.mjs"
          node -v
          mkdir -p "$RUNNER_TEMP/portable"
          tar -xzf downloads/*-linux-legacy-x64-portable.tar.gz -C "$RUNNER_TEMP/portable"
          node "$smoke" "$RUNNER_TEMP"/portable/LLMHarbor-* x64
          appimage=$(ls "$PWD"/downloads/*-linux-legacy-x64.AppImage)
          chmod +x "$appimage"
          SMOKE_LAUNCHER="$appimage" node "$smoke" - x64
          sudo dpkg -i downloads/*-linux-legacy-x64.deb
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' llmharbor-legacy
          SMOKE_LAUNCHER=/usr/bin/llmharbor-legacy node "$smoke" - x64
          sudo dpkg -r llmharbor-legacy
          test ! -e /usr/lib/llmharbor-legacy && test ! -e /usr/bin/llmharbor-legacy
      - name: Run the x86 files in a 32-bit ${{ matrix.image }} container without network
        if: matrix.arch == 'x86'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          case "$IMAGE" in
            alpine:*) install='apk add --no-cache nodejs ca-certificates' ;;
            debian:*) install='apt-get update && apt-get install -y --no-install-recommends nodejs ca-certificates && rm -rf /var/lib/apt/lists/*' ;;
          esac
          printf 'FROM %s\nRUN %s\n' "$IMAGE" "$install" | docker build --platform linux/386 -t llmharbor-legacy-x86 -
          docker run --rm --platform linux/386 --network none \
            -v "$PWD/downloads:/downloads:ro" \
            -v "$PWD/desktop/scripts/smoke-linux-browser.mjs:/smoke.mjs:ro" \
            -v "$PWD/desktop/linux-browser/smoke-legacy-x86.sh:/smoke-legacy-x86.sh:ro" \
            llmharbor-legacy-x86 sh /smoke-legacy-x86.sh

  # Electron 23+ dropped Windows 7, 8 and 8.1. These run on the checksum-pinned
  # Electron-Legacy community runtime (see desktop/win7/README.md).
  windows-legacy:
    name: Windows 7/8/8.1 · ${{ matrix.arch }} portable and installer
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build dashboard and gateway (x64 build tools, no native npm addons)
        shell: bash
        run: |
          set -euo pipefail
          bash desktop/scripts/retry-network-step.sh npm ci --ignore-scripts
          bash desktop/scripts/retry-network-step.sh npm --prefix desktop ci --ignore-scripts
          npm run build -w client -- --mode win7 --outDir ../desktop/dist-electron/windows7/client --emptyOutDir
          npm --prefix desktop run bundle:win7
      - name: Package checksum-pinned Electron-Legacy
        run: python desktop/win7/package.py ${{ matrix.arch }}
      - name: Launch extracted ZIP, exercise dashboard, SQLite, API and update isolation
        shell: pwsh
        run: |
          $zip = Get-Item 'desktop/dist-electron/windows7/LLMHarbor-*-windows7-${{ matrix.arch }}.zip'
          $temp = Join-Path $env:RUNNER_TEMP 'win7 smoke'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $temp
          node desktop/win7/smoke.mjs (Join-Path $temp $zip.BaseName) ${{ matrix.arch }}
          exit $LASTEXITCODE
      - name: Build the per-user installer from the verified ZIP
        shell: pwsh
        run: |
          $zip = Get-Item 'desktop/dist-electron/windows7/LLMHarbor-*-windows7-${{ matrix.arch }}.zip'
          $src = Join-Path $env:RUNNER_TEMP 'installer-src'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $src
          $version = (python desktop/win7/package.py --version).Trim()
          $preview = (Get-Content desktop/win7/runtime.json -Raw | ConvertFrom-Json).preview
          $base = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $makensis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) {
            choco install nsis -y --no-progress | Out-Host
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          $out = Join-Path $zip.DirectoryName "$($zip.BaseName)-setup.exe"
          & $makensis /V2 "/DVERSION=$version" "/DNUMVER=$base.$preview" "/DARCH=${{ matrix.arch }}" `
            "/DSRC=$(Join-Path $src $zip.BaseName)" "/DICON=$PWD\desktop\assets\tray.ico" `
            "/DLICENSE=$PWD\LICENSE" "/DOUTFILE=$out" desktop\win7\installer.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Item $out | Format-List Name, Length
      - name: Install silently, launch the installed copy, then uninstall
        shell: pwsh
        run: |
          # smoke.mjs insists on a fresh profile; the ZIP run above created one.
          $data = Join-Path $env:APPDATA 'LLMHarbor-Win7'
          for ($i = 0; (Test-Path $data) -and $i -lt 10; $i++) {
            Remove-Item -Recurse -Force $data -ErrorAction SilentlyContinue
            if (Test-Path $data) { Start-Sleep -Seconds 2 }
          }
          if (Test-Path $data) { throw "Could not reset $data" }
          $setup = Get-Item 'desktop/dist-electron/windows7/LLMHarbor-*-windows7-${{ matrix.arch }}-setup.exe'
          $dir = Join-Path $env:RUNNER_TEMP 'legacy-install'
          $run = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($run.ExitCode) { throw "Installer exited with $($run.ExitCode)" }
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\LLMHarbor Legacy.lnk'
          if (-not (Test-Path $menu)) { throw 'Start Menu shortcut missing' }
          node desktop/win7/smoke.mjs $dir ${{ matrix.arch }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $run = Start-Process -FilePath (Join-Path $dir 'Uninstall.exe') -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($run.ExitCode) { throw "Uninstaller exited with $($run.ExitCode)" }
          if (Test-Path (Join-Path $dir 'LLMHarbor.exe')) { throw 'Uninstall left the app behind' }
          if (Test-Path $menu) { throw 'Uninstall left the Start Menu shortcut behind' }
          Write-Host "Installer, installed app and uninstaller passed for ${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win7-${{ matrix.arch }}
          path: |
            desktop/dist-electron/windows7/LLMHarbor-*-windows7-${{ matrix.arch }}.zip
            desktop/dist-electron/windows7/LLMHarbor-*-windows7-${{ matrix.arch }}-setup.exe
          compression-level: 0
          if-no-files-found: error

  android:
    name: Android · build, sign and verify every ABI
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Build production dashboard and gateway
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build -w client -- --mode android --outDir ../android/build/dashboard --emptyOutDir
          node android/scripts/bundle.mjs
          python3 android/scripts/check-strings.py
          python3 android/tests/host.py
      - name: Prepare the signing identity
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DURABLE_ID: ${{ vars.ANDROID_PACKAGE_ID }}
        run: |
          # With no durable secret the build is a version-locked preview signed by
          # a one-time key; with one it keeps a stable ID so updates install in place.
          if [[ -n "${ANDROID_KEYSTORE_B64:-}" ]]; then
            source android/scripts/durable-key.sh
            echo "ANDROID_SIGNING_MODE=durable" >> "$GITHUB_ENV"
            echo "ANDROID_PACKAGE_ID=${DURABLE_ID:-io.github.zelvior.llmharbor.android}" >> "$GITHUB_ENV"
          else
            source android/scripts/preview-key.sh
            echo "ANDROID_SIGNING_MODE=preview" >> "$GITHUB_ENV"
          fi
          echo "::add-mask::$APK_PASSWORD"
          {
            echo "APK_KEYSTORE=$APK_KEYSTORE"
            echo "APK_ALIAS=$APK_ALIAS"
            echo "APK_PASSWORD=$APK_PASSWORD"
            echo "ANDROID_KEY_DIR=$APK_KEY_DIR"
          } >> "$GITHUB_ENV"
      - name: Package, sign and verify every ABI
        run: |
          trap 'rm -rf "$ANDROID_KEY_DIR"' EXIT
          android/scripts/package.sh
          cp android/build/package/package-id android/build/apks/package-id
          (cd android/build/apks && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      # Artifact name kept for android-device.yml (`gh run download -n android-apks`).
      - name: Upload the signed APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks
          path: android/build/apks
          if-no-files-found: error
          compression-level: 0

  android-device:
    name: Android · ${{ matrix.label }}
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 'ARMv7 APK on Android 11 (native bridge)', abi: armeabi-v7a, api: 30, target: google_apis, arch: x86, build: '16428233' }
          - { label: 'Android 9, oldest supported', abi: x86_64, api: 28, target: default, arch: x86_64, build: '' }
          - { label: 'x86_64 APK on Android 14', abi: x86_64, api: 34, target: google_apis, arch: x86_64, build: '16428233' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apks
          path: downloads
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install and exercise the APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          emulator-build: ${{ matrix.build }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ABI=${{ matrix.abi }} EXPECTED_SDK=${{ matrix.api }} APK_DIR=downloads python3 android/tests/device.py

  macos-release:
    name: macOS · verify and combine update metadata
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Install metadata tooling
        shell: bash
        run: bash desktop/scripts/retry-network-step.sh npm --prefix desktop ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-installer-*
          path: artifacts
      - name: Verify artifacts and merge update metadata
        run: |
          node desktop/scripts/merge-mac-update-metadata.mjs \
            artifacts/macos-installer-arm64 artifacts/macos-installer-x64 \
            artifacts/latest-mac.yml
      - name: Upload combined update metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-update-metadata
          path: artifacts/latest-mac.yml
          if-no-files-found: error

  # Always stages (renames + validates every file and feed) and writes the
  # notes, so pull requests prove the release set; only a dispatch with
  # publish checked creates the GitHub release.
  publish:
    name: Stage and publish to GitHub Releases
    needs: [prepare, desktop, macos-release, linux-legacy, linux-legacy-test, windows-legacy, android, android-device]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: release-publisher
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm --prefix desktop ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Rename every file and validate names and update feeds
        run: |
          node desktop/scripts/stage-release.mjs artifacts release
          ls -l release
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          node desktop/scripts/release-notes.mjs release "$TAG" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md"
          if [ "$NOTES" = auto ] && [ "$PUBLISH" = true ]; then
            # Compare against the previous desktop release, not the newest
            # android-v*/win7-v* preview tag GitHub would otherwise pick.
            previous=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vxF "$TAG" | head -n 1 || true)
            args=(-f "tag_name=$TAG" -f "target_commitish=$(git rev-parse HEAD)")
            if [ -n "$previous" ]; then args+=(-f "previous_tag_name=$previous"); fi
            { echo; gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body; } >> "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach to a draft, verify uploads, then publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
          TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          title=${TITLE:-LLMHarbor $TAG}
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || { echo "::error::refusing to replace a published release"; exit 1; }
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --draft --target "$sha" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" release/* --clobber
          # A successful upload alone does not rule out stale assets on a draft.
          (cd release && find . -type f -printf '%f\t%s\n' | sort) > expected.txt
          gh release view "$TAG" --json assets --jq '.assets[] | [.name, .size] | @tsv' | sort > actual.txt
          diff -u expected.txt actual.txt
          case "$TYPE" in
            latest) gh release edit "$TAG" --target "$sha" --draft=false --prerelease=false --latest ;;
            prerelease) gh release edit "$TAG" --target "$sha" --draft=false --prerelease --latest=false ;;
            draft) echo "::notice::$TAG stays a draft; publish it from the Releases page." ;;
          esac
          echo "Release: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
